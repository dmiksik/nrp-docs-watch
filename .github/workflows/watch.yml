name: Watch NRP-CZ/docs

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      since:
        description: "Backfill: zpracuj změny od data (YYYY-MM-DD), ignoruj uložený stav"
        required: false
        type: string
      max_commits:
        description: "Max. počet změn (PR + commitů) na běh (výchozí 10)"
        required: false
        type: string
        default: "10"

permissions:
  issues: write             # post digest comments
  contents: write           # commit updated state.json

concurrency:
  group: docs-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for documentation changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E_INFRA_API_TOKEN: ${{ secrets.E_INFRA_API_TOKEN }}
          E_INFRA_MODEL: ${{ vars.E_INFRA_MODEL || 'kimi-k3' }}
          SINCE_DATE: ${{ inputs.since || '' }}
          MAX_ITEMS_PER_RUN: ${{ inputs.max_commits || '10' }}
        run: python watch_docs.py

      - name: Commit updated state
        run: |
          if git diff --quiet state.json 2>/dev/null; then
            echo "state.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update watch state [skip ci]"
          git push
